name: Smoke tests

# Script tests live in strata-space/strata-claude-plugin-tests: the Claude
# plugin directory refuses scripts and programs in a plugin repo.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  manifest:
    name: validate manifest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - name: validate JSON syntax
        run: |
          jq empty .claude-plugin/plugin.json
          jq empty .codex-plugin/plugin.json
          jq empty .mcp.json
          jq empty .codex-mcp.json
          jq empty .cursor-plugin/plugin.json
          jq empty mcp.json
      - name: manifest versions stay in lockstep
        run: |
          claude_v=$(jq -r .version .claude-plugin/plugin.json)
          codex_v=$(jq -r .version .codex-plugin/plugin.json)
          manifest_v=$(jq -r '."."' .release-please-manifest.json)
          cursor_v=$(jq -r .version .cursor-plugin/plugin.json)
          test "$claude_v" = "$codex_v"
          test "$claude_v" = "$cursor_v"
          test "$claude_v" = "$manifest_v"
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "20"
      - name: install Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code
      - name: claude plugin validate (plugin manifest)
        run: claude plugin validate .claude-plugin/plugin.json
